name: CI

# Runs on every push to main and on every pull request. A red build means something is broken or
# unformatted; fix it before merging. The same checks run locally with:  python scripts/check.py

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests, coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . ../scripts --config pyproject.toml
      - name: Formatting
        run: ruff format --check . ../scripts --config pyproject.toml
      - name: Types
        run: mypy
      - name: Tests and coverage (fails under the threshold in pyproject.toml)
        run: pytest --cov --cov-report=term

  frontend:
    name: Frontend (lint, tests, coverage, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Tests and coverage (fails under the thresholds in vite.config.js)
        run: npm run coverage
      - name: Production build
        run: npm run build

  e2e:
    name: End-to-end (Playwright, demo mode)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the browser tests
        working-directory: frontend
        env:
          CI: "1"
          E2E_PYTHON: python
        run: npm run e2e
      - name: Keep the report when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  infrastructure:
    name: Generated Terraform and Kubernetes validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Generate sample infrastructure (also checks HCL and YAML syntax)
        run: python scripts/validate_generated.py "$RUNNER_TEMP/generated"
      - uses: hashicorp/setup-terraform@v3
      - name: terraform validate (the files must be valid for the AWS provider)
        run: |
          set -e
          for dir in "$RUNNER_TEMP"/generated/*/terraform; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done
      - name: "terraform fmt (informational - generated spacing may differ from the canonical style)"
        continue-on-error: true
        run: terraform fmt -check -recursive -diff "$RUNNER_TEMP/generated"
      - name: kubeconform (Kubernetes YAML against the API schemas)
        run: |
          set -e
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/kubeconform" -strict -summary -kubernetes-version 1.30.0 "$RUNNER_TEMP"/generated/*/kubernetes

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sysdesign-backend backend
      - run: docker build -t sysdesign-frontend frontend
